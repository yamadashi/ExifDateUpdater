# fly.toml app configuration file generated for exif-date-updater-api on 2026-07-29T17:59:06+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'exif-date-updater-api'
primary_region = 'nrt'

[build]
[env]
  CLIENT_ORIGIN = 'http://localhost:3000'
  DATA_DIR = '/data'
  FILE_TTL_MINUTES = '30'
  PORT = '8080'

[[mounts]]
  source = 'exif_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
